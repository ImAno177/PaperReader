name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for CodeQL extraction
        run: >-
          ./gradlew
          :app:assembleDebug
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --stacktrace

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:java-kotlin
