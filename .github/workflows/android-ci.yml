name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  documentation:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  quality-and-apk:
    name: Test, lint, and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select Android verification scope
        id: android_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          run_android = True
          base = os.environ["BASE_SHA"]
          if os.environ["EVENT_NAME"] == "pull_request" and re.fullmatch(r"[0-9a-f]{40}", base):
              try:
                  subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base], check=True)
                  diff = subprocess.check_output([
                      "git", "diff", "--no-renames", "--name-only", "-z", base, "HEAD", "--",
                  ])
                  paths = [os.fsdecode(path) for path in diff.split(b"\0") if path]
                  run_android = not paths or not all(
                      path.startswith("docs/") or ("/" not in path and path.endswith(".md"))
                      for path in paths
                  )
              except (OSError, subprocess.CalledProcessError):
                  print("::warning::Could not inspect changed paths; running the full Android gate.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"run_android={str(run_android).lower()}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(
                  "Full Android verification selected." if run_android else
                  "Android build skipped: this pull request changes only root Markdown or docs/ files. "
                  "Documentation, dependency review, and security checks still run.",
                  file=summary,
              )
          PY

      - name: Set up Android build
        if: steps.android_gate.outputs.run_android == 'true'
        uses: ./.github/actions/setup-android
        with:
          # Same-repository pull requests write a PR-scoped cache so later pushes reuse
          # dependencies and build outputs; main pushes refresh the shared cache. Fork
          # pull requests and manual runs outside main only read.
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true || (github.event_name != 'pull_request' && github.ref != 'refs/heads/main') }}

      - name: Verify host code and build APKs
        id: quality_gate
        if: steps.android_gate.outputs.run_android == 'true'
        shell: bash
        env:
          BUILD_FULL_ARTIFACTS: ${{ github.event_name != 'pull_request' }}
        run: |
          tasks=(hostUnitTest hostLint :app:assembleDebug)
          if [[ "$BUILD_FULL_ARTIFACTS" == "true" ]]; then
            tasks+=(coverageReport :app:assembleRelease)
          fi
          ./gradlew "${tasks[@]}" --stacktrace

      - name: Upload verification reports on failure
        if: failure() && steps.quality_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            extension-api/build/reports/tests/testDebugUnitTest
            logic/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            */build/test-results/testDebugUnitTest/TEST-*.xml
            */build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jacoco-unit-${{ github.sha }}
          path: |
            extension-api/build/reports/jacoco/debug
            logic/build/reports/jacoco/debug
            app/build/reports/jacoco/debug
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-${{ github.sha }}.spdx.json
          artifact-name: paperreader-sbom-${{ github.sha }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Upload debug APK
        if: steps.android_gate.outputs.run_android == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paperreader-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paperreader-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobsfscan:
    name: MobSF source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run MobSF static analysis
        uses: MobSF/mobsfscan@18cce72c077cbac1925439c3158363fd3bb361aa
        with:
          args: >-
            . --type android --sarif --output mobsfscan.sarif --no-fail

      - name: Upload MobSF SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan
