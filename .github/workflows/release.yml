name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version without the v prefix
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number

permissions:
  actions: read
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
      - name: Set up Gradle (read-only cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          # A release is a cache consumer; the default-branch CI writer keeps
          # dependency and transform entries fresh without release duplicates.
          cache-read-only: true
      - name: Require green Android CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow android-ci.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --json databaseId \
            --jq 'length > 0' | grep -qx true; then
            echo "Android CI has no successful run for $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Restore app signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paperreader.jks"
          chmod 600 "$RUNNER_TEMP/paperreader.jks"
      - name: Verify and build signed release
        env:
          STORE_PASSWORD: ${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          -PappVersionName=${{ inputs.version_name }}
          -PappVersionCode=${{ inputs.version_code }}
          -PappKeystorePath="$RUNNER_TEMP/paperreader.jks"
          -PappKeystorePassword="$STORE_PASSWORD"
          -PappKeyAlias="$KEY_ALIAS"
          -PappKeyPassword="$KEY_PASSWORD"
          :app:lintRelease
          :app:assembleRelease
          --stacktrace
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          verify --verbose --print-certs
          app/build/outputs/apk/release/app-release.apk
      - name: Generate release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-${{ inputs.version_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version_name }}"
          app/build/outputs/apk/release/app-release.apk
          paperreader-${{ inputs.version_name }}.spdx.json
          --title "PaperReader v${{ inputs.version_name }}"
          --generate-notes
          --target "${{ github.sha }}"
