name: Android CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-gate:
        description: Set by the release workflow. The gate reads the Gradle cache and never writes it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: main
          head-ref: ${{ github.sha }}

  documentation:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  quality-and-apk:
    name: Test, lint, and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Android build
        uses: ./.github/actions/setup-android
        with:
          # Only main runs write the Gradle cache. Runs on other refs and release-gate
          # calls read it, so branch runs cannot change shared cache entries.
          cache-read-only: ${{ inputs.release-gate || github.ref != 'refs/heads/main' }}

      - name: Verify host code and build APKs
        id: quality_gate
        shell: bash
        run: ./gradlew hostUnitTest hostLint :app:assembleDebug coverageReport :app:assembleRelease --stacktrace

      - name: Upload verification reports on failure
        if: failure() && steps.quality_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            extension-api/build/reports/tests/testDebugUnitTest
            logic/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            */build/test-results/testDebugUnitTest/TEST-*.xml
            */build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jacoco-unit-${{ github.sha }}
          path: |
            extension-api/build/reports/jacoco/debug
            logic/build/reports/jacoco/debug
            app/build/reports/jacoco/debug
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-${{ github.sha }}.spdx.json
          artifact-name: paperreader-sbom-${{ github.sha }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paperreader-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paperreader-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobsfscan:
    name: MobSF source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run MobSF static analysis
        uses: MobSF/mobsfscan@18cce72c077cbac1925439c3158363fd3bb361aa
        with:
          args: >-
            . --type android --sarif --output mobsfscan.sarif --no-fail

      - name: Upload MobSF SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan
