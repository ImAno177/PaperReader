name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version without the v prefix
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Restore app signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paperreader.jks"
          chmod 600 "$RUNNER_TEMP/paperreader.jks"
      - name: Verify and build signed release
        env:
          STORE_PASSWORD: ${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          -PappVersionName=${{ inputs.version_name }}
          -PappVersionCode=${{ inputs.version_code }}
          -PappKeystorePath="$RUNNER_TEMP/paperreader.jks"
          -PappKeystorePassword="$STORE_PASSWORD"
          -PappKeyAlias="$KEY_ALIAS"
          -PappKeyPassword="$KEY_PASSWORD"
          :extension-api:testDebugUnitTest
          :extension-api:lintDebug
          :logic:testDebugUnitTest
          :logic:lintDebug
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease
          --stacktrace
      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: paperreader-${{ inputs.version_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version_name }}"
          app/build/outputs/apk/release/app-release.apk
          paperreader-${{ inputs.version_name }}.spdx.json
          --title "PaperReader v${{ inputs.version_name }}"
          --generate-notes
          --target "${{ github.sha }}"
