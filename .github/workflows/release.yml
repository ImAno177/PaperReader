name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version without the v prefix
        required: true
        type: string
      version_code:
        description: Android version code (1 to 2100000000; must exceed the previous release)
        required: true
        type: number
      dry_run:
        description: Run validation, the Android gate, and CodeQL without publishing a tag, release, or asset
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.dry_run && 'app-release-dry-run' || 'app-release' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          if os.environ["GITHUB_REF"] != "refs/heads/main" and os.environ["DRY_RUN"] != "true":
              raise SystemExit("Releases must be dispatched from main")
          version = os.environ["VERSION_NAME"]
          match = re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?",
              version,
          )
          if match is None or any(
              part.isdigit() and len(part) > 1 and part.startswith("0")
              for part in (match.group(4) or "").split(".")
          ):
              raise SystemExit("version_name must be a valid semantic version without v")
          code = os.environ["VERSION_CODE"]
          if not re.fullmatch(r"[1-9][0-9]*", code) or int(code) > 2100000000:
              raise SystemExit("version_code must be an integer from 1 to 2100000000")
          PY

  android-gate:
    name: Android CI gate
    needs: validate
    uses: ./.github/workflows/android-ci.yml
    with:
      release-gate: true
    permissions:
      actions: read
      contents: read
      security-events: write

  codeql:
    name: CodeQL
    needs: validate
    uses: ./.github/workflows/codeql.yml
    with:
      dry_run: ${{ inputs.dry_run }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  release:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    needs: [android-gate, codeql]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Android build
        id: android_build
        uses: ./.github/actions/setup-android

      - name: Restore app signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paperreader.jks"
          chmod 600 "$RUNNER_TEMP/paperreader.jks"

      - name: Verify and build signed release
        env:
          ORG_GRADLE_PROJECT_appVersionName: ${{ inputs.version_name }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ inputs.version_code }}
          ORG_GRADLE_PROJECT_appKeystorePath: ${{ runner.temp }}/paperreader.jks
          ORG_GRADLE_PROJECT_appKeystorePassword: ${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_appKeyAlias: ${{ secrets.APP_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_appKeyPassword: ${{ secrets.APP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify APK signature
        env:
          BUILD_TOOLS_VERSION: ${{ steps.android_build.outputs.build-tools-version }}
        run: >-
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          verify --verbose --print-certs
          app/build/outputs/apk/release/app-release.apk

      - name: Generate release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-${{ inputs.version_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Publish GitHub release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION_NAME"
          app/build/outputs/apk/release/app-release.apk
          "paperreader-$VERSION_NAME.spdx.json"
          --title "PaperReader v$VERSION_NAME"
          --generate-notes
          --prerelease
          --latest=false
          --target "$GITHUB_SHA"

      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/paperreader.jks"
