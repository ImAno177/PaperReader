version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      # Dependabot supports cron schedules. Two fixed monthly review windows keep
      # dependency work batched without a permanently open weekly queue.
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
    reviewers:
      - "ImAno177"
    assignees:
      - "ImAno177"
    commit-message:
      prefix: "deps"
    groups:
      gradle-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      gradle-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # These releases require compileSdk 37. Remove the pins only with the
      # repository's explicit SDK 37 migration.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.08.00"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
    reviewers:
      - "ImAno177"
    assignees:
      - "ImAno177"
    commit-message:
      prefix: "deps"
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
