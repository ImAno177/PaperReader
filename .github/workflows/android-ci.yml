name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  documentation:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff

  quality-and-apk:
    name: Test, lint, and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          # Keep one trusted writer for the default branch. Pull requests and
          # manual/non-main runs restore the shared cache without creating a
          # new cache entry for every commit.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Verify host code and build APKs
        id: quality_gate
        shell: bash
        env:
          BUILD_FULL_ARTIFACTS: ${{ github.event_name != 'pull_request' }}
        run: |
          tasks=(hostUnitTest hostLint :app:assembleDebug)
          if [[ "$BUILD_FULL_ARTIFACTS" == "true" ]]; then
            tasks+=(coverageReport :app:assembleRelease)
          fi
          ./gradlew "${tasks[@]}" --stacktrace

      - name: Upload unit-test report when tests fail
        if: failure() && steps.quality_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            extension-api/build/reports/tests/testDebugUnitTest
            logic/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jacoco-unit-${{ github.sha }}
          path: |
            extension-api/build/reports/jacoco/debug
            logic/build/reports/jacoco/debug
            app/build/reports/jacoco/debug
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-${{ github.sha }}.spdx.json
          artifact-name: paperreader-sbom-${{ github.sha }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paperreader-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paperreader-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobsfscan:
    name: MobSF source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run MobSF static analysis
        uses: MobSF/mobsfscan@18cce72c077cbac1925439c3158363fd3bb361aa
        with:
          args: >-
            . --type android --sarif --output mobsfscan.sarif --no-fail

      - name: Upload MobSF SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan
