version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      # Dependabot supports named intervals, not cron expressions. Keep the
      # update window predictable; maintainers review and merge these grouped
      # PRs every other Monday.
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    reviewers:
      - "ImAno177"
    assignees:
      - "ImAno177"
    commit-message:
      prefix: "deps"
    groups:
      gradle-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      gradle-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    reviewers:
      - "ImAno177"
    assignees:
      - "ImAno177"
    commit-message:
      prefix: "deps"
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
